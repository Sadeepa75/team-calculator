<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <h1>Simple Calculator</h1>
        <!-- Task 3: Add button in index.html -->
        <button id="add-btn" onclick="performAddition()">Add (5 + 3)</button>
        <p id="output-display" aria-live="polite"></p>
    </main>

    <!-- Link your calculator script -->
    <script src="calculator.js"></script>
    <script>
        function performAddition() {
            // Call the add function implemented in calculator.js
            const result = add(5, 3);
            
            // Display the result on the webpage
            document.getElementById('output-display').innerText = `Result: ${result}`;
        }
    </script>
</body>
</html>
